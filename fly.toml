# fly.toml app configuration file generated for fs-pokedex-airy-wind-1568 on 2026-08-16T13:48:04+05:45
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
app = 'fs-pokedex-airy-wind-1568'
primary_region = 'sin'

[build]

[env]
  PORT = "5001"

[processes]
  app = "node app.js"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[http_service.http_checks]]
  interval = "10s"
  grace_period = "5s"
  method = "get"
  path = "/health"
  protocol = "http"
  timeout = "2s"

[deploy]
  strategy = "canary"